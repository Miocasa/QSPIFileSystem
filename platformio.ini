[env:xiao_ble_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_TINYUSB
    -DCFG_TUH_MSC=0
lib_archive = no
lib_ldf_mode = deep+
lib_deps =
    adafruit/Adafruit nRFCrypto@^0.1.2
    seeed-studio/Seeed Arduino LSM6DS3@^2.0.5
    https://github.com/adafruit/Adafruit_SPIFlash.git
